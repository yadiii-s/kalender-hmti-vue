<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masuk ke SIPMA HMJ — Sistem Informasi Penjadwalan dan Manajemen Kegiatan Himpunan Mahasiswa.">
  <title>Masuk — SIPMA HMJ</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232563EB'/%3E%3Ctext x='50' y='68' font-size='52' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'%3EH%3C/text%3E%3C/svg%3E">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/responsive.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="preloader"><div class="preloader-spinner"></div></div>

  <!-- ==================================================
       LOGIN CARD
       ================================================== -->
  <div class="login-card animate__animated animate__zoomIn" data-aos="zoom-in">
    <div class="login-logo"><i class="bi bi-calendar2-week"></i></div>
    <h2>Selamat Datang</h2>
    <p class="subtitle">Masuk untuk mengelola kegiatan himpunan mahasiswa</p>

    <form id="loginForm" novalidate>
      <div class="mb-3 position-relative">
        <i class="bi bi-envelope input-icon"></i>
        <div class="form-floating">
          <input type="email" class="form-control" id="email" placeholder="Email" required>
          <label for="email">Email</label>
        </div>
      </div>

      <div class="mb-3 position-relative">
        <i class="bi bi-lock input-icon"></i>
        <div class="form-floating">
          <input type="password" class="form-control" id="password" placeholder="Kata Sandi" required>
          <label for="password">Kata Sandi</label>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label small text-muted" for="remember">Ingat saya</label>
        </div>
        <a href="#" class="small text-decoration-none fw-semibold" style="color:var(--primary)">Lupa sandi?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
        <i class="bi bi-box-arrow-in-right"></i> Masuk
      </button>
    </form>

    <div class="login-divider">atau</div>

    <button class="btn btn-light btn-lg w-100 mb-3" style="border:1.5px solid var(--border)">
      <i class="bi bi-google me-2" style="color:#EA4335"></i> Masuk dengan Google
    </button>

    <p class="back-home">
      Belum punya akun? <a href="#" class="fw-semibold text-decoration-none" style="color:var(--primary)">Daftar di sini</a>
    </p>
    <p class="back-home">
      <a href="index.html" class="text-decoration-none text-muted">
        <i class="bi bi-arrow-left"></i> Kembali ke Beranda
      </a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
